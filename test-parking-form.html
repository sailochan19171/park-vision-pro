<!DOCTYPE html>
<html>
<head>
    <title>Test Parking Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <h2>Test Parking Spot Creation</h2>
    
    <div class="card">
        <div class="card-body">
            <form id="testForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="level" class="form-label">Level</label>
                        <select class="form-select" id="level" required>
                            <option value="">Select Level</option>
                            <option value="Level 1">Level 1</option>
                            <option value="Level 2">Level 2</option>
                            <option value="Level 3">Level 3</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="section" class="form-label">Section</label>
                        <select class="form-select" id="section" required>
                            <option value="">Select Section</option>
                            <option value="A">Section A</option>
                            <option value="B">Section B</option>
                            <option value="C">Section C</option>
                            <option value="D">Section D</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="number" class="form-label">Spot Number</label>
                        <input type="number" class="form-control" id="number" min="1" max="999" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="rate" class="form-label">Hourly Rate (₹)</label>
                        <input type="number" class="form-control" id="rate" min="1" value="25" required>
                    </div>
                </div>
                
                <button type="button" class="btn btn-primary" onclick="testAddSpot()">Test Create Spot</button>
            </form>
            
            <div class="mt-3">
                <h5>Form Data Preview:</h5>
                <pre id="formPreview" class="bg-light p-3">Fill form to see data...</pre>
            </div>
            
            <div class="mt-3">
                <h5>API Response:</h5>
                <pre id="apiResponse" class="bg-light p-3">Click "Test Create Spot" to see response...</pre>
            </div>
        </div>
    </div>

    <script>
        // Real-time form preview
        function updatePreview() {
            const level = document.getElementById('level').value;
            const section = document.getElementById('section').value;
            const number = document.getElementById('number').value;
            const rate = document.getElementById('rate').value;
            
            const formData = {
                level: level,
                section: section,
                number: parseInt(number) || 0,
                rate: parseInt(rate) || 25
            };
            
            document.getElementById('formPreview').textContent = JSON.stringify(formData, null, 2);
        }
        
        // Add event listeners
        document.getElementById('level').addEventListener('change', updatePreview);
        document.getElementById('section').addEventListener('change', updatePreview);
        document.getElementById('number').addEventListener('input', updatePreview);
        document.getElementById('rate').addEventListener('input', updatePreview);
        
        // Test the API call
        async function testAddSpot() {
            try {
                const level = document.getElementById('level').value.trim();
                const section = document.getElementById('section').value.trim();
                const number = document.getElementById('number').value.trim();
                const rate = document.getElementById('rate').value.trim();
                
                console.log('🧪 Form values:', { level, section, number, rate });
                
                if (!level || !section || !number) {
                    alert('Please fill in all required fields!');
                    return;
                }
                
                const spotData = {
                    level: level,
                    section: section,
                    number: parseInt(number),
                    rate: parseInt(rate) || 25
                };
                
                console.log('🧪 Sending data:', spotData);
                
                const response = await fetch('http://localhost:8080/api/admin/parking/spots', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(spotData)
                });
                
                const result = await response.json();
                console.log('🧪 API response:', result);
                
                document.getElementById('apiResponse').textContent = JSON.stringify(result, null, 2);
                
                if (result.success) {
                    alert('SUCCESS: Parking spot created!\n\n' + JSON.stringify(result.data, null, 2));
                } else {
                    alert('ERROR: ' + result.message);
                }
                
            } catch (error) {
                console.error('🚨 Test error:', error);
                document.getElementById('apiResponse').textContent = 'Error: ' + error.message;
                alert('ERROR: ' + error.message);
            }
        }
        
        // Initialize preview
        updatePreview();
    </script>
</body>
</html>
