<!DOCTYPE html>
<html>
<head>
    <title>Test Formspree Email</title>
</head>
<body>
    <h1>Test Formspree Email Sending</h1>
    <button onclick="testEmail()">Test Send Email to info@vayaccess.com</button>
    <pre id="result"></pre>

    <script>
    async function testEmail() {
        const resultDiv = document.getElementById('result');
        resultDiv.textContent = 'Sending test email...';
        
        try {
            const response = await fetch('https://formspree.io/f/mzzvkeqy', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    email: 'info@vayaccess.com',
                    name: 'Test User',
                    subject: '🤖 Test Chatbot Email - ' + new Date().toLocaleString(),
                    message: `🤖 TEST CHATBOT CONVERSATION

This is a test email to verify the chatbot email system is working.

📊 Test Details:
• Timestamp: ${new Date().toLocaleString()}
• Source: Manual Test

❓ USER QUESTION:
"What are your barrier gate prices?"

🤖 BOT RESPONSE:
"Our barrier gates range from $3,500-8,500 depending on features..."

---
This is a test email from the VayBot Assistant.`,
                    user_question: 'What are your barrier gate prices?',
                    bot_response: 'Our barrier gates range from $3,500-8,500 depending on features...',
                })
            });

            console.log('Response status:', response.status);
            console.log('Response ok:', response.ok);
            
            if (response.ok) {
                const data = await response.text();
                resultDiv.textContent = '✅ SUCCESS! Email sent to info@vayaccess.com\n\nResponse: ' + data;
                console.log('✅ Success:', data);
            } else {
                const errorText = await response.text();
                resultDiv.textContent = '❌ FAILED!\n\nStatus: ' + response.status + '\nError: ' + errorText;
                console.error('❌ Failed:', response.status, errorText);
            }
        } catch (error) {
            resultDiv.textContent = '❌ NETWORK ERROR: ' + error.message;
            console.error('❌ Network error:', error);
        }
    }
    </script>
</body>
</html>
