<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Parking System API Test</h1>
    
    <div class="test-section">
        <h3>1. Login Test</h3>
        <button onclick="testLogin()">Test Login</button>
        <div id="loginResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>2. Profile Test</h3>
        <button onclick="testProfile()">Test Profile</button>
        <div id="profileResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>3. Bookings Test</h3>
        <button onclick="testBookings()">Test Bookings</button>
        <div id="bookingsResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>4. Parking Spots Test</h3>
        <button onclick="testParkingSpots()">Test Parking Spots</button>
        <div id="parkingSpotsResult" class="result"></div>
    </div>

    <script>
        async function testLogin() {
            const resultDiv = document.getElementById('loginResult');
            resultDiv.innerHTML = 'Testing login...';
            
            try {
                const response = await fetch('/user/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: 'email=alice@example.com&password=User@123',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    resultDiv.innerHTML = '<div class="success">✅ Login successful! Redirected to dashboard.</div>';
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ Login failed: ${response.status}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Login error: ${error.message}</div>`;
            }
        }
        
        async function testProfile() {
            const resultDiv = document.getElementById('profileResult');
            resultDiv.innerHTML = 'Testing profile API...';
            
            try {
                const response = await fetch('/api/user/profile', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    resultDiv.innerHTML = `<div class="success">✅ Profile API working!<br>User: ${data.data.user.name} (${data.data.user.email})</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ Profile API failed: ${data.message || 'Unknown error'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Profile API error: ${error.message}</div>`;
            }
        }
        
        async function testBookings() {
            const resultDiv = document.getElementById('bookingsResult');
            resultDiv.innerHTML = 'Testing bookings API...';
            
            try {
                const response = await fetch('/api/user/bookings?page=1&limit=10', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    resultDiv.innerHTML = `<div class="success">✅ Bookings API working!<br>Found ${data.data.bookings.length} bookings<br>Total: ${data.data.pagination.totalBookings}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ Bookings API failed: ${data.message || 'Unknown error'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Bookings API error: ${error.message}</div>`;
            }
        }
        
        async function testParkingSpots() {
            const resultDiv = document.getElementById('parkingSpotsResult');
            resultDiv.innerHTML = 'Testing parking spots API...';
            
            try {
                const response = await fetch('/api/user/parking-spots', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    resultDiv.innerHTML = `<div class="success">✅ Parking Spots API working!<br>Found ${data.data.spots.length} spots</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ Parking Spots API failed: ${data.message || 'Unknown error'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Parking Spots API error: ${error.message}</div>`;
            }
        }
        
        // Auto-run tests in sequence
        async function runAllTests() {
            console.log('Running all tests...');
            await testLogin();
            await new Promise(resolve => setTimeout(resolve, 1000));
            await testProfile();
            await new Promise(resolve => setTimeout(resolve, 1000));
            await testBookings();
            await new Promise(resolve => setTimeout(resolve, 1000));
            await testParkingSpots();
        }
        
        // Run tests when page loads
        window.addEventListener('load', () => {
            setTimeout(runAllTests, 1000);
        });
    </script>
</body>
</html>
