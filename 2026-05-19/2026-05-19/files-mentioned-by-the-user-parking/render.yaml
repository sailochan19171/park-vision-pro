# One-click deploy on Render.com — free tier.
# After pushing this repo to GitHub:
#   1. Render dashboard → New + → Blueprint
#   2. Connect your GitHub repo, pick this folder as root
#   3. Click "Apply" — Render reads this file and creates the web service.
# Free dynos sleep after 15 min of no traffic; first request takes ~30 s to wake.
# DATABASE_URL must be set in the Render dashboard to your Neon connection string.
services:
  - type: web
    name: vayaccess-cloud
    runtime: python
    plan: free
    region: singapore           # closest free region to India; use 'oregon' for US.
    buildCommand: "pip install -r requirements-cloud.txt"
    startCommand: "waitress-serve --host=0.0.0.0 --port=$PORT --threads=8 app:app"
    envVars:
      - key: CLOUD_MODE
        value: "1"
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false             # Neon postgres URL — set in the Render dashboard.
      # Auto-generated by Render on first deploy (long random string, kept across
      # restarts). Used for Flask session cookies + admin /api/login.
      - key: SECRET_KEY
        generateValue: true
      # Signs the QR pass tokens that the gate kiosk verifies via /v/<token>.
      # generateValue gives a strong random; rotating it invalidates outstanding
      # QR passes, which is the safe default.
      - key: PASS_SECRET
        generateValue: true
      # First-deploy admin seed. The seed_defaults() routine creates an admin
      # account with this user + password if no account has a password yet.
      # Change the password from the UI immediately after first login.
      - key: INITIAL_ADMIN_USER
        value: admin
      - key: INITIAL_ADMIN_PASSWORD
        sync: false             # Set in the Render dashboard — never commit.
