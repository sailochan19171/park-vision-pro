appId: com.farmleysfa
name: "05 - End Day Flow"
---
- launchApp

# Go to Home tab
- tapOn: "Home"
- extendedWaitUntil:
    visible: "Farmley"
    timeout: 5000

# Scroll to End Day button
- scroll:
    direction: DOWN
    amount: 800
- takeScreenshot: "../lochan farmley screenshots/21_dashboard_end_day_visible"

# Tap End Day
- tapOn: "End Day"
- extendedWaitUntil:
    visible: "End of Day Summary"
    timeout: 5000
- takeScreenshot: "../lochan farmley screenshots/22_end_day_summary"

# Final sync & end
- tapOn: "Final Sync & End Day"
- extendedWaitUntil:
    visible: "Day Ended"
    timeout: 15000
- takeScreenshot: "../lochan farmley screenshots/23_day_ended_alert"

# Confirm
- tapOn: "OK"
- takeScreenshot: "../lochan farmley screenshots/24_dashboard_day_ended"
