appId: com.farmleysfa
---
# TEST 09: Planogram Compliance
# Verify: Planogram → Select Makhana → Yes Followed → Recorded

- launchApp:
    clearState: true

# Login
- extendedWaitUntil:
    visible: "Farmley"
    timeout: 10000
- tapOn:
    id: "username-input"
- inputText: "admin"
- tapOn:
    id: "password-input"
- inputText: "farmley123"
- hideKeyboard
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "Start Day"
    timeout: 60000

# Navigate to stores
- tapOn: "See all"
- extendedWaitUntil:
    visible: "My Stores"
    timeout: 10000

# Tap first store and check in
- tapOn:
    text: "MT"
    index: 0
- extendedWaitUntil:
    visible: "Check In"
    timeout: 5000
- tapOn: "Check In"
- extendedWaitUntil:
    visible: "Checked in"
    timeout: 10000

# Tap Planogram card (swipe-as-tap at ~63%)
- swipe:
    start: "50%,63%"
    end: "51%,63%"
    duration: 100
- extendedWaitUntil:
    visible: "Select Category"
    timeout: 10000
- takeScreenshot: screenshots/test-09-planogram-categories

# Select Makhana category
- tapOn: "Makhana"
- extendedWaitUntil:
    visible: "Yes, Followed"
    timeout: 5000
- takeScreenshot: screenshots/test-09-planogram-compliance

# Mark as followed
- tapOn: "Yes, Followed"
- assertVisible: "Recorded"
- takeScreenshot: screenshots/test-09-planogram-recorded
