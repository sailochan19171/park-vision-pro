appId: com.farmleysfa
---
# === FULL DAY E2E: Login → Sync → Attendance → Visit → Order → Store Check → Planogram → Checkout → EOD ===

# 1. LOGIN + INITIAL SYNC
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Farmley"
    timeout: 15000
- tapOn:
    id: "username-input"
- inputText: "admin"
- tapOn:
    id: "password-input"
- inputText: "farmley123"
- hideKeyboard
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "Start Day"
    timeout: 60000
- takeScreenshot: screenshots/e2e-01-dashboard

# 2. ATTENDANCE
- tapOn: "Start Day"
- extendedWaitUntil:
    visible: "Start Your Day"
    timeout: 5000
- takeScreenshot: screenshots/e2e-02-attendance
- scrollUntilVisible:
    element: "Mark Attendance & Start Day"
    direction: DOWN
- tapOn: "Mark Attendance & Start Day"
- extendedWaitUntil:
    visible: "Day Started"
    timeout: 10000
- takeScreenshot: screenshots/e2e-03-day-started
- tapOn: "Go to Stores"

# 3. STORES LIST
- extendedWaitUntil:
    visible: "My Stores"
    timeout: 10000
- takeScreenshot: screenshots/e2e-04-stores

# 4. CHECK IN AT STORE
- tapOn:
    text: "MT"
    index: 0
- extendedWaitUntil:
    visible: "Check In"
    timeout: 5000
- takeScreenshot: screenshots/e2e-05-customer-visit
- tapOn: "Check In"
- extendedWaitUntil:
    visible: "Checked in"
    timeout: 5000
- takeScreenshot: screenshots/e2e-06-checked-in

# 5. PLACE ORDER (swipe-as-tap at Place Order card ~47%)
- swipe:
    start: "50%,47%"
    end: "51%,47%"
    duration: 100
- extendedWaitUntil:
    visible: "ALL"
    timeout: 15000
- takeScreenshot: screenshots/e2e-07-order-screen
# Select Makhana category
- tapOn: "MAKHANA"
# Add 3 of first item
- tapOn:
    text: "+"
    index: 0
- tapOn:
    text: "+"
    index: 0
- tapOn:
    text: "+"
    index: 0
- takeScreenshot: screenshots/e2e-08-order-items
# Place order
- tapOn: "Place Order"
- extendedWaitUntil:
    visible: "Order Placed"
    timeout: 5000
- takeScreenshot: screenshots/e2e-09-order-placed
- tapOn: "OK"

# 6. STORE CHECK (swipe-as-tap at ~55%)
- extendedWaitUntil:
    visible: "Checked in"
    timeout: 5000
- swipe:
    start: "50%,55%"
    end: "51%,55%"
    duration: 100
- extendedWaitUntil:
    visible: "MSL Only"
    timeout: 20000
- takeScreenshot: screenshots/e2e-10-store-check
- back

# 7. PLANOGRAM (swipe-as-tap at ~63%)
- extendedWaitUntil:
    visible: "Checked in"
    timeout: 5000
- swipe:
    start: "50%,63%"
    end: "51%,63%"
    duration: 100
- extendedWaitUntil:
    visible: "Select Category"
    timeout: 10000
- takeScreenshot: screenshots/e2e-11-planogram
- tapOn: "Makhana"
- extendedWaitUntil:
    visible: "Yes, Followed"
    timeout: 5000
- tapOn: "Yes, Followed"
- takeScreenshot: screenshots/e2e-12-planogram-done
- back

# 8. CHECK OUT
- extendedWaitUntil:
    visible: "Checked in"
    timeout: 5000
- scrollUntilVisible:
    element: "Check Out"
    direction: DOWN
- tapOn: "Check Out"
- extendedWaitUntil:
    visible: "Checked Out"
    timeout: 10000
- takeScreenshot: screenshots/e2e-13-checked-out
- tapOn: "OK"

# 9. END OF DAY — navigate to Home tab first
- extendedWaitUntil:
    visible: "My Stores"
    timeout: 5000
- tapOn:
    point: "12%,97%"
- extendedWaitUntil:
    visible: "Start Day"
    timeout: 10000
- scrollUntilVisible:
    element: "End Day"
    direction: DOWN
- tapOn: "End Day"
- extendedWaitUntil:
    visible: "End of Day Summary"
    timeout: 10000
- takeScreenshot: screenshots/e2e-14-end-of-day
