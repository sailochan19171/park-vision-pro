appId: com.farmleysfa
---
# TEST 05: Check In + Check Out
# Verify: Check in at store, verify timer, check out, verify duration

- launchApp:
    clearState: true

# Login
- extendedWaitUntil:
    visible: "Farmley"
    timeout: 10000
- tapOn:
    id: "username-input"
- inputText: "admin"
- tapOn:
    id: "password-input"
- inputText: "farmley123"
- hideKeyboard
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "Start Day"
    timeout: 60000

# Navigate to stores
- tapOn: "See all"
- extendedWaitUntil:
    visible: "My Stores"
    timeout: 10000

# Tap first store
- tapOn:
    text: "MT"
    index: 0
- extendedWaitUntil:
    visible: "Check In"
    timeout: 5000
- takeScreenshot: screenshots/test-05-before-checkin

# Check In
- tapOn: "Check In"
- extendedWaitUntil:
    visible: "Checked in"
    timeout: 10000
- takeScreenshot: screenshots/test-05-checked-in

# Scroll to Check Out button
- scrollUntilVisible:
    element: "Check Out"
    direction: DOWN

# Check Out
- tapOn: "Check Out"
- extendedWaitUntil:
    visible: "Checked Out"
    timeout: 10000
- takeScreenshot: screenshots/test-05-checked-out
- tapOn: "OK"
