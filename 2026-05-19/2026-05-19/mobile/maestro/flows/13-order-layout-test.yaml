appId: com.farmleysfa
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Farmley"
    timeout: 15000
- tapOn:
    id: "username-input"
- inputText: "admin"
- tapOn:
    id: "password-input"
- inputText: "farmley123"
- hideKeyboard
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "Start Day"
    timeout: 60000
- tapOn: "See all"
- extendedWaitUntil:
    visible: "My Stores"
    timeout: 10000
- tapOn:
    text: "MT"
    index: 0
- extendedWaitUntil:
    visible: "Check In"
    timeout: 5000
- tapOn: "Check In"
- extendedWaitUntil:
    visible: "Checked in"
    timeout: 10000
# Open Order screen
- swipe:
    start: "50%,47%"
    end: "51%,47%"
    duration: 100
- extendedWaitUntil:
    visible: "ALL"
    timeout: 15000
- takeScreenshot: screenshots/order-layout-1-all
# Tap Makhana
- tapOn: "MAKHANA"
- takeScreenshot: screenshots/order-layout-2-makhana
# Add items
- tapOn:
    text: "+"
    index: 0
- tapOn:
    text: "+"
    index: 0
- tapOn:
    text: "+"
    index: 0
- tapOn:
    text: "+"
    index: 1
- tapOn:
    text: "+"
    index: 1
- takeScreenshot: screenshots/order-layout-3-items-added
