appId: com.farmleysfa
---
# === COMPLETE TEST SUITE: Every feature verified ===

# ── TEST 1: LOGIN + INITIAL SYNC ──
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Farmley"
    timeout: 15000
- tapOn:
    id: "username-input"
- inputText: "admin"
- tapOn:
    id: "password-input"
- inputText: "farmley123"
- hideKeyboard
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "Start Day"
    timeout: 60000
- assertVisible: "Today's Stores"
- takeScreenshot: screenshots/test-01-dashboard

# ── TEST 2: ATTENDANCE (Start Day) ──
- tapOn: "Start Day"
- extendedWaitUntil:
    visible: "Start Your Day"
    timeout: 5000
- scrollUntilVisible:
    element: "Mark Attendance & Start Day"
    direction: DOWN
- tapOn: "Mark Attendance & Start Day"
- extendedWaitUntil:
    visible: "Day Started"
    timeout: 15000
- takeScreenshot: screenshots/test-02-attendance-done
- tapOn: "Go to Stores"

# ── TEST 3: STORES LIST ──
- extendedWaitUntil:
    visible: "My Stores"
    timeout: 10000
- takeScreenshot: screenshots/test-03-stores

# ── TEST 4: CUSTOMER VISIT + CHECK-IN ──
- tapOn:
    text: "MT"
    index: 0
- extendedWaitUntil:
    visible: "Check In"
    timeout: 5000
- takeScreenshot: screenshots/test-04-visit-before-checkin
- tapOn: "Check In"
- extendedWaitUntil:
    visible: "Checked in"
    timeout: 10000
- takeScreenshot: screenshots/test-05-checked-in

# ── TEST 5: PLACE ORDER (category sidebar + tax) ──
- swipe:
    start: "50%,47%"
    end: "51%,47%"
    duration: 100
- extendedWaitUntil:
    visible: "ALL"
    timeout: 15000
- takeScreenshot: screenshots/test-06-order-screen
- tapOn: "MAKHANA"
- tapOn:
    text: "+"
    index: 0
- tapOn:
    text: "+"
    index: 0
- tapOn:
    text: "+"
    index: 0
- takeScreenshot: screenshots/test-07-order-makhana-3
- tapOn: "Place Order"
- extendedWaitUntil:
    visible: "Order Placed"
    timeout: 5000
- takeScreenshot: screenshots/test-08-order-placed
- tapOn: "OK"

# ── TEST 6: STORE CHECK ──
- extendedWaitUntil:
    visible: "Checked in"
    timeout: 5000
- swipe:
    start: "50%,55%"
    end: "51%,55%"
    duration: 100
- extendedWaitUntil:
    visible: "ALMONDS"
    timeout: 20000
- takeScreenshot: screenshots/test-09-store-check
- back

# ── TEST 7: PLANOGRAM ──
- extendedWaitUntil:
    visible: "Checked in"
    timeout: 5000
- swipe:
    start: "50%,63%"
    end: "51%,63%"
    duration: 100
- extendedWaitUntil:
    visible: "Select Category"
    timeout: 10000
- tapOn: "Makhana"
- extendedWaitUntil:
    visible: "Yes, Followed"
    timeout: 5000
- takeScreenshot: screenshots/test-10-planogram
- tapOn: "Yes, Followed"
- takeScreenshot: screenshots/test-11-planogram-done
- back

# ── TEST 8: CHECK OUT (auto-sync) ──
- extendedWaitUntil:
    visible: "Checked in"
    timeout: 5000
- scrollUntilVisible:
    element: "Check Out"
    direction: DOWN
- tapOn: "Check Out"
- extendedWaitUntil:
    visible: "Checked Out"
    timeout: 10000
- takeScreenshot: screenshots/test-12-checked-out
- tapOn: "OK"

# ── TEST 9: ORDER HISTORY ──
- extendedWaitUntil:
    visible: "My Stores"
    timeout: 5000
- back
- extendedWaitUntil:
    visible: "Start Day"
    timeout: 5000

# ── TEST 10: END OF DAY ──
- scrollUntilVisible:
    element: "End Day"
    direction: DOWN
- tapOn: "End Day"
- extendedWaitUntil:
    visible: "End of Day Summary"
    timeout: 10000
- takeScreenshot: screenshots/test-13-end-of-day

# ── TEST 11: SETTINGS + SYNC ──
- back
- extendedWaitUntil:
    visible: "Start Day"
    timeout: 5000
- tapOn:
    point: "88%,97%"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 5000
- takeScreenshot: screenshots/test-14-settings
